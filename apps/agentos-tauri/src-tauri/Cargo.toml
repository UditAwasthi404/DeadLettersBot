[package]
name = "agentos-tauri"
description = "AgentOS desktop shell (Tauri v2) — replaces Electron incrementally"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agentos_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentos-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentos-agent-core = { path = "../../../crates/agentos-agent-core" }
agentos-tools = { path = "../../../crates/agentos-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }