apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentos.fullname" . }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret must be set to a strong random value" .Values.secrets.jwtSecret | quote }}
  JWT_SECRET_PREVIOUS: {{ .Values.secrets.jwtSecretPrevious | quote }}
  CONNECTOR_ENCRYPTION_KEY: {{ required "secrets.connectorEncryptionKey must be 64 hex characters" .Values.secrets.connectorEncryptionKey | quote }}
  CONNECTOR_ENCRYPTION_KEY_PREVIOUS: {{ .Values.secrets.connectorEncryptionKeyPrevious | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.password must be set" .Values.postgres.password | quote }}
  MINIO_ROOT_PASSWORD: {{ required "minio.rootPassword must be set" .Values.minio.rootPassword | quote }}
  OPENAI_API_KEY: {{ if has "openai" (splitList "," .Values.inference.providers) }}{{ required "inference.openaiApiKey is required when openai is selected" .Values.inference.openaiApiKey | quote }}{{ else }}""{{ end }}
  ANTHROPIC_API_KEY: {{ if has "anthropic" (splitList "," .Values.inference.providers) }}{{ required "inference.anthropicApiKey is required when anthropic is selected" .Values.inference.anthropicApiKey | quote }}{{ else }}""{{ end }}
  XAI_API_KEY: {{ if has "xai" (splitList "," .Values.inference.providers) }}{{ required "inference.xaiApiKey is required when xai is selected" .Values.inference.xaiApiKey | quote }}{{ else }}""{{ end }}
