apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentos.fullname" . }}-box-host
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentos.fullname" . }}-vm-manager
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentos.fullname" . }}-vm-manager
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agentos.fullname" . }}-box-host
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentos.fullname" . }}-vm-manager
