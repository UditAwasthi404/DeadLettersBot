{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "AgentOS must run with exactly one replica until turn and VM routing are externalized" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.fullname" . }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "agentos.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.fullname" . }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentos.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentos.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: box-host
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8787"
            - name: BOT_STEP_BUDGET
              value: {{ .Values.agent.stepBudget | quote }}
            - name: MODEL_CONTEXT_TOKENS
              value: {{ .Values.agent.contextTokens | quote }}
            - name: MEMORY_SYNTHESIS_ENABLED
              value: {{ .Values.agent.memorySynthesisEnabled | ternary "1" "0" | quote }}
            - name: MCP_STRICT_MODE
              value: {{ .Values.agent.mcpStrictMode | ternary "1" "0" | quote }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.username | urlquery }}:{{ .Values.postgres.password | urlquery }}@{{ include "agentos.fullname" . }}-postgres:5432/{{ .Values.postgres.database | urlquery }}"
            - name: REDIS_URL
              value: "redis://{{ include "agentos.fullname" . }}-redis:6379"
            - name: S3_ENDPOINT
              value: "http://{{ include "agentos.fullname" . }}-minio:9000"
            - name: S3_REGION
              value: us-east-1
            - name: S3_ACCESS_KEY
              value: {{ .Values.minio.rootUser | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: MINIO_ROOT_PASSWORD
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: JWT_SECRET
            - name: JWT_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: JWT_SECRET_PREVIOUS
            - name: CONNECTOR_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: CONNECTOR_ENCRYPTION_KEY
            - name: CONNECTOR_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: CONNECTOR_ENCRYPTION_KEY_PREVIOUS
            - name: INFERENCE_MOCK
              value: "0"
            - name: INFERENCE_PROVIDERS
              value: {{ .Values.inference.providers | quote }}
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: XAI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: ANTHROPIC_API_KEY
            - name: OLLAMA_BASE_URL
              value: {{ .Values.inference.ollamaBaseUrl | quote }}
            - name: WEBHOOK_MAX_ATTEMPTS
              value: {{ .Values.webhooks.maxAttempts | quote }}
            - name: WEBHOOK_DELIVERY_RETENTION_DAYS
              value: {{ .Values.webhooks.retentionDays | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
