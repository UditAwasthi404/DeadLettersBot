{{- if and (not .Values.autoscaling.enabled) (ne (int .Values.replicaCount) 1) }}
{{- fail "set autoscaling.enabled=true to run multiple box-host replicas" }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- if lt (int .Values.autoscaling.minReplicas) 2 }}
{{- fail "autoscaling.minReplicas must be at least 2 when autoscaling is enabled" }}
{{- end }}
{{- if lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas) }}
{{- fail "autoscaling.maxReplicas must be greater than or equal to autoscaling.minReplicas" }}
{{- end }}
{{- if or (lt (int .Values.autoscaling.targetCPUUtilizationPercentage) 1) (gt (int .Values.autoscaling.targetCPUUtilizationPercentage) 100) }}
{{- fail "autoscaling.targetCPUUtilizationPercentage must be between 1 and 100" }}
{{- end }}
{{- end }}
{{- if not (has .Values.agent.vmEgressPolicy (list "allow_all" "deny_all" "allowlist")) }}
{{- fail "agent.vmEgressPolicy must be allow_all, deny_all, or allowlist" }}
{{- end }}
{{- if and (ne .Values.agent.vmEgressPolicy "allowlist") (gt (len .Values.agent.vmEgressAllowlist) 0) }}
{{- fail "agent.vmEgressAllowlist requires agent.vmEgressPolicy=allowlist" }}
{{- end }}
{{- if eq .Values.agent.vmEgressPolicy "allowlist" }}
{{- if eq (len .Values.agent.vmEgressAllowlist) 0 }}
{{- fail "agent.vmEgressAllowlist must contain at least one CIDR rule when egress policy is allowlist" }}
{{- end }}
{{- range $rule := .Values.agent.vmEgressAllowlist }}
{{- if not (regexMatch "^[0-9A-Fa-f:.]+/[0-9]{1,3}$" $rule.cidr) }}
{{- fail (printf "invalid CIDR in agent.vmEgressAllowlist: %v" $rule.cidr) }}
{{- end }}
{{- if eq (len $rule.ports) 0 }}
{{- fail (printf "CIDR %v must specify at least one egress port" $rule.cidr) }}
{{- end }}
{{- range $port := $rule.ports }}
{{- if or (lt (int $port.port) 1) (gt (int $port.port) 65535) }}
{{- fail (printf "invalid port in agent.vmEgressAllowlist for CIDR %v" $rule.cidr) }}
{{- end }}
{{- if not (has ($port.protocol | default "TCP") (list "TCP" "UDP" "SCTP")) }}
{{- fail (printf "invalid protocol in agent.vmEgressAllowlist for CIDR %v" $rule.cidr) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if or (le (int64 .Values.agent.vmMemoryBytes) 0) (gt (int64 .Values.agent.vmMemoryBytes) 9007199254740991) }}
{{- fail "agent.vmMemoryBytes must be a positive integer no greater than Number.MAX_SAFE_INTEGER" }}
{{- end }}
{{- if or (le (int64 .Values.agent.vmCpuNanos) 0) (gt (int64 .Values.agent.vmCpuNanos) 9007199254740991) }}
{{- fail "agent.vmCpuNanos must be a positive integer no greater than Number.MAX_SAFE_INTEGER" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.fullname" . }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "agentos.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.fullname" . }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.autoscaling.enabled }}{{ .Values.autoscaling.minReplicas }}{{ else }}{{ .Values.replicaCount }}{{ end }}
  selector:
    matchLabels:
      {{- include "agentos.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: box-host
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agentos.fullname" . }}-box-host
      containers:
        - name: box-host
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8787"
            - name: BOT_STEP_BUDGET
              value: {{ .Values.agent.stepBudget | quote }}
            - name: MODEL_CONTEXT_TOKENS
              value: {{ .Values.agent.contextTokens | quote }}
            - name: MEMORY_SYNTHESIS_ENABLED
              value: {{ .Values.agent.memorySynthesisEnabled | ternary "1" "0" | quote }}
            - name: MCP_STRICT_MODE
              value: {{ .Values.agent.mcpStrictMode | ternary "1" "0" | quote }}
            - name: DYNAMIC_TOOL_OFFLOADING
              value: {{ .Values.agent.dynamicToolOffloading | ternary "1" "0" | quote }}
            - name: VM_EGRESS_POLICY
              value: {{ .Values.agent.vmEgressPolicy | quote }}
            - name: VM_MEMORY_BYTES
              value: {{ .Values.agent.vmMemoryBytes | quote }}
            - name: VM_CPU_NANOS
              value: {{ .Values.agent.vmCpuNanos | quote }}
            - name: VM_BACKEND
              value: kubernetes
            - name: VM_IMAGE
              value: "{{ .Values.vmManager.image.repository }}:{{ .Values.vmManager.image.tag }}"
            - name: VM_IMAGE_PULL_POLICY
              value: {{ .Values.vmManager.image.pullPolicy | quote }}
            - name: VM_K8S_STORAGE_SIZE
              value: {{ .Values.vmManager.storageSize | quote }}
            - name: VM_K8S_STORAGE_CLASS
              value: {{ .Values.vmManager.storageClassName | quote }}
            - name: VM_K8S_INSTANCE
              value: {{ .Release.Name | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.vmManager.image.pullSecret }}
            - name: VM_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.username | urlquery }}:{{ .Values.postgres.password | urlquery }}@{{ include "agentos.fullname" . }}-postgres:5432/{{ .Values.postgres.database | urlquery }}"
            - name: REDIS_URL
              value: "redis://{{ include "agentos.fullname" . }}-redis:6379"
            - name: S3_ENDPOINT
              value: "http://{{ include "agentos.fullname" . }}-minio:9000"
            - name: S3_REGION
              value: us-east-1
            - name: S3_ACCESS_KEY
              value: {{ .Values.minio.rootUser | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: MINIO_ROOT_PASSWORD
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: JWT_SECRET
            - name: JWT_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: JWT_SECRET_PREVIOUS
            - name: CONNECTOR_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: CONNECTOR_ENCRYPTION_KEY
            - name: CONNECTOR_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: CONNECTOR_ENCRYPTION_KEY_PREVIOUS
            - name: INFERENCE_MOCK
              value: "0"
            - name: INFERENCE_PROVIDERS
              value: {{ .Values.inference.providers | quote }}
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: XAI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}
                  key: ANTHROPIC_API_KEY
            - name: OLLAMA_BASE_URL
              value: {{ .Values.inference.ollamaBaseUrl | quote }}
            - name: WEBHOOK_MAX_ATTEMPTS
              value: {{ .Values.webhooks.maxAttempts | quote }}
            - name: WEBHOOK_DELIVERY_RETENTION_DAYS
              value: {{ .Values.webhooks.retentionDays | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
