# Self-hosted local AgentOS stack.
# Settings come from the repository root .env. Start with:
# docker compose --project-directory . -f infra/docker/docker-compose.yml up -d --build
services:
  box-host:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.host
    # Matches Dockerfile.host. Migrations must run from packages/shared so relative paths resolve.
    command:
      [
        "sh",
        "-c",
        "cd /app/packages/shared && bun ./node_modules/drizzle-kit/bin.cjs migrate && cd /app && bun run packages/box-host/src/index.ts",
      ]
    environment:
      PORT: 8787
      METRICS_ENABLED: ${METRICS_ENABLED:-0}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      BOT_STEP_BUDGET: ${BOT_STEP_BUDGET:-50}
      MODEL_CONTEXT_TOKENS: ${MODEL_CONTEXT_TOKENS:-128000}
      MEMORY_SYNTHESIS_ENABLED: ${MEMORY_SYNTHESIS_ENABLED:-0}
      MCP_STRICT_MODE: ${MCP_STRICT_MODE:-0}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-6}
      WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:-30}
      VM_MEMORY_BYTES: ${VM_MEMORY_BYTES:-2147483648}
      VM_CPU_NANOS: ${VM_CPU_NANOS:-2000000000}
      VM_PIDS_LIMIT: ${VM_PIDS_LIMIT:-512}
      VM_HOST_IN_DOCKER: "1"
      DATABASE_URL: postgresql://agentos:agentos@postgres:5432/agentos
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_MOCK: ${CLERK_MOCK:-0}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:-}
      CONNECTOR_ENCRYPTION_KEY_PREVIOUS: ${CONNECTOR_ENCRYPTION_KEY_PREVIOUS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://127.0.0.1:8787/v1/connectors/oauth/callback}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:8787/v1/connectors/oauth/callback}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_EXTRA_SCOPES: ${MICROSOFT_OAUTH_EXTRA_SCOPES:-}
      SALESFORCE_OAUTH_CLIENT_ID: ${SALESFORCE_OAUTH_CLIENT_ID:-}
      SALESFORCE_OAUTH_CLIENT_SECRET: ${SALESFORCE_OAUTH_CLIENT_SECRET:-}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      INFERENCE_MOCK: ${INFERENCE_MOCK:-0}
      INFERENCE_PROVIDERS: ${INFERENCE_PROVIDERS:-xai}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8787/health'); if(!r.ok) process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      vm-template: { condition: service_completed_successfully }

  # Optional HTTPS entry point. Set AGENTOS_DOMAIN to a public DNS name to use
  # Caddy's automatic certificate provisioning, or localhost for local testing.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    environment:
      AGENTOS_DOMAIN: ${CADDY_DOMAIN:-${AGENTOS_DOMAIN:-localhost}}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - box-host

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      - box-host

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-use}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
      POSTGRES_DB: agentos
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Official minio/minio images no longer allow anonymous pulls (Docker Hub removed, Quay returns 401).
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Build the VM image before the host starts; runtime instances are launched on demand.
  vm-template:
    build:
      context: infra/docker
      dockerfile: Dockerfile.vm
    image: agentos-vm
    command: ["true"]
    restart: "no"

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
  prometheusdata:
  grafanadata:

networks:
  default:
    name: agentos
